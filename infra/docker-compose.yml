services:
  mysql:
    image: mysql:8.4
    container_name: field-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: field_clinic
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - field-net

  java-backend:
    build: ../java-backend
    container_name: field-java
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/field_clinic?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123456
      AI_SERVICE_URL: http://python-agents:8001
    depends_on:
      - mysql
      - python-agents
    restart: on-failure
    networks:
      - field-net

  python-agents:
    build: ../python-agents
    container_name: field-python
    ports:
      - "8001:8001"
    networks:
      - field-net

volumes:
  mysql_data:

networks:
  field-net:
    driver: bridge